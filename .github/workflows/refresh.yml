name: refresh

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

# The token is given only to the steps that talk to Cloudflare, never to installs or builds.
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '860e267e26cbf52bdca301d114b3c203' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: tools/layout
      # oeis.org refuses downloads from Actions runners; the oeisdata mirror on
      # GitHub carries the same terms and names.
      - name: fetch the oeisdata checkout
        run: |
          git clone --depth 1 --quiet https://github.com/oeis/oeisdata.git data/oeisdata
          echo "SNAPSHOT=$(git -C data/oeisdata log -1 --format=%cs)" >> "$GITHUB_ENV"
      - name: compute features
        run: |
          cargo build --release --manifest-path tools/Cargo.toml
          tools/target/release/atlas features data/oeisdata data/features
      # Each run writes a fresh prefix and the manifest flips to it last, so a
      # page that loaded mid-run never mixes two snapshots and a failed run
      # leaves the live one untouched.
      - name: pick the previous and the new generation
        run: |
          previous=$(curl -sSf https://sequence-atlas.dwainosaur.com/data/manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          generation=$(date -u +%Y%m%d)
          [ "$generation" = "$previous" ] && generation="$generation-$GITHUB_RUN_NUMBER"
          echo "PREVIOUS=v/$previous" >> "$GITHUB_ENV"
          echo "GENERATION=v/$generation" >> "$GITHUB_ENV"
          echo "previous v/$previous, new v/$generation"
      - name: download the previous artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/r2-pull.ts "$PREVIOUS" data/prev
      - name: place new sequences and rebuild shards
        working-directory: tools/layout
        run: |
          uv sync --locked
          uv run layout.py place ../../data/features ../../data/prev ../../data/next --snapshot "$SNAPSHOT"
      - name: upload changed objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/r2-sync.ts data/next "$GENERATION"
      - name: load the standby search database and flip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/search-sql.ts data/features/meta.tsv data/search.sql
          node scripts/d1-refresh.ts data/search.sql
      - name: publish the manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/r2-manifest.ts data/next "$GENERATION"
