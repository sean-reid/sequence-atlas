<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sequence-atlas</title>
    <meta
      name="description"
      content="A map of the OEIS: every integer sequence as a point, near the sequences it is alike."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        var t = localStorage.getItem("sequence-atlas:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="map" aria-label="Map of OEIS sequences"></canvas>
    <div id="labels" class="labels" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <h1 class="wordmark">sequence-atlas</h1>
        <p class="lede">
          Every OEIS sequence as a point, beside the sequences it is alike. Pick a measure, then a
          point.
        </p>
      </div>
      <nav class="metrics" aria-label="Measure of likeness">
        <button type="button" class="on" data-family="all">All</button>
        <button type="button" data-family="growth">Growth</button>
        <button type="button" data-family="arith">Arithmetic</button>
        <button type="button" data-family="recur">Recurrence</button>
        <button type="button" data-family="graph">References</button>
      </nav>
    </header>

    <div class="tools">
      <form class="search" role="search">
        <label class="visually-hidden" for="q">Find a sequence</label>
        <input
          id="q"
          type="search"
          placeholder="A000045, Fibonacci, or 1, 1, 2, 3, 5"
          autocomplete="off"
          aria-controls="results"
        />
        <ol class="results" id="results" hidden></ol>
      </form>
      <label class="colour" hidden>
        <span class="visually-hidden">Colour points by</span>
        <select id="colour">
          <option value="cluster">Colour: cluster</option>
          <option value="growth">Colour: growth class</option>
          <option value="order">Colour: recurrence order</option>
          <option value="keyword">Colour: keyword</option>
        </select>
      </label>
      <button type="button" id="theme" class="theme">Light</button>
    </div>

    <aside class="panel" id="panel" aria-label="Selected sequence" hidden>
      <header class="panel-head">
        <p class="anumber" id="p-number"></p>
        <h2 class="name" id="p-name"></h2>
        <button type="button" class="close" id="p-close">Close</button>
      </header>
      <p class="terms" id="p-terms"></p>
      <p class="keywords" id="p-keywords"></p>
      <p class="summary" id="p-summary"></p>
      <h3 class="near-head" id="p-near-head"></h3>
      <ol class="near" id="p-near"></ol>
      <p class="oeis"><a id="p-oeis" href="https://oeis.org">at oeis.org</a></p>
    </aside>
    <div class="hover" id="hover" hidden></div>

    <footer class="foot">
      <a href="https://github.com/sean-reid/sequence-atlas">Source</a>
      <span
        >Data from the <a href="https://oeis.org">OEIS</a>, CC BY-SA 4.0, snapshot 2026-10-15. Not
        affiliated with the OEIS Foundation.</span
      >
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
