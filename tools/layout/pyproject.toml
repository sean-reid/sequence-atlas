[project]
name = "atlas-layout"
version = "0.0.0"
description = "Projects the feature matrix from the atlas tool into the layouts the site serves."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "umap-learn>=0.5.7",
    "pynndescent>=0.5.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 120
